<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | MealDrop</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="catalog.css">
    <link rel="stylesheet" href="lab8.css">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="lab9.css">
  <link rel="stylesheet" href="lab10.css">
</head>
<body>
    <header class="header container">
        <img src="menu 1.png" alt="" class="menu1">
        <a href="saut.html" class="logo">
            <img src="Logo_blue.png" alt="Logo" class="logo-icon">
            <span class="logo-text">MealDrop</span>
        </a>
        <nav class="navigation">
            <a href="saut.html" class="nav-home">Home</a>
            <a href="#" class="nav-rest">All restaurants</a>
            
            <a href="favorites.html" class="nav-fav" style="margin-right: 15px; text-decoration: none;">
                ❤ Favorites
            </a>

            <a href="cart.html" class="cart-btn" style="text-decoration: none;">
                <img src="grocery_basket_icon.png" alt="корзина">
            </a>
        </nav>
    </header>

    <main class="catalog-page container">
        <h1 class="catalog-title">Shopping Cart</h1>

        <div id="cartItems" style="display: flex; flex-direction: column; gap: 20px; margin-bottom: 40px;"></div>

        <div style="border-top: 2px solid #202020; padding-top: 20px; display: flex; justify-content: space-between; align-items: center;">
            <h2>Итого: $<span id="cartTotal">0</span></h2>
            <button onclick="checkout()" style="padding: 15px 30px; font-size: 18px; background: #202020; color: white; border: none; border-radius: 10px; cursor: pointer;">
                Оформить покупку
            </button>
        </div>
    </main>

    <script src="cart.js"></script>
<script src="common.js"></script>
<script src="lab9.js"></script>
<script src="lab10.js"></script>
</body>
</html>
